<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script src="client.js"></script><title>Live Overlay</title></head>
<body>
<div class="frame cam" id="cam"></div>
<div class="live" id="lv"><i></i><span id="lvt">LIVE</span></div>
<div class="panel lower" id="lt"><div class="n grad" id="n"></div><div class="t" id="tp"></div></div>
<div class="panel chat" id="ch"><h4>Chat</h4>Chat-Browserquelle hier einblenden (Twitch/YouTube Chat-URL).</div>
<div class="panel goal" id="go"><div class="l"><span id="gl"></span><span id="gv"></span></div><div class="bar"><i id="gb"></i></div></div>
<div class="panel bottom" id="bt"><div class="tag" id="tg">INFO</div><div class="tick" id="tk"></div></div>
<div id="custom"></div>
<script>
let items=[],i=0;
let chatKey="",irc=null,ircTimer=null;
const IRC_URL=new URLSearchParams(location.search).get("irc")||"wss://irc-ws.chat.twitch.tv:443";
function setChat(st){
 const cu=(st.chatUrl||"").replace(/\{host\}/g,location.hostname);
 const key=st.twitchChannel?"irc:"+st.twitchChannel:cu?"url:"+cu:"none";
 if(key===chatKey)return;chatKey=key;stopIrc();
 ch.classList.toggle("embed",key.startsWith("url:"));
 if(key.startsWith("irc:")){ch.innerHTML='<h4></h4><div class="msgs" id="msgs"></div>';startIrc(st.twitchChannel)}
 else if(cu)ch.innerHTML='<iframe src="'+cu.replace(/"/g,"&quot;")+'"></iframe>';
 else ch.innerHTML='<h4></h4>Chat im Kontrollpanel einrichten.';
}
function stopIrc(){clearTimeout(ircTimer);if(irc){irc.onclose=null;irc.close();irc=null}}
function startIrc(chn){
 const ws=irc=new WebSocket(IRC_URL);
 ws.onopen=()=>{ws.send("CAP REQ :twitch.tv/tags");ws.send("PASS SCHMOOPIIE");ws.send("NICK justinfan"+(10000+Math.random()*80000|0));ws.send("JOIN #"+chn)};
 ws.onmessage=e=>String(e.data).split("\r\n").forEach(l=>ircLine(ws,l));
 ws.onclose=()=>{ircTimer=setTimeout(()=>startIrc(chn),5000)};
}
function ircLine(ws,l){
 if(l.startsWith("PING"))return ws.send("PONG :tmi.twitch.tv");
 const m=l.match(/^(?:@(\S+) )?:([^!]+)![^ ]+ PRIVMSG #\S+ :(.*)$/);if(!m)return;
 const tags={};(m[1]||"").split(";").forEach(t=>{const i=t.indexOf("=");tags[t.slice(0,i)]=t.slice(i+1)});
 let text=m[3];if(text.startsWith("\x01ACTION ")){text=text.slice(8).replace(/\x01$/,"")}
 const chars=Array.from(text),rep=[];
 (tags.emotes||"").split("/").filter(Boolean).forEach(e=>{const[id,pos]=e.split(":");pos.split(",").forEach(r=>{const[a,b]=r.split("-").map(Number);rep.push({a,b,id})})});
 rep.sort((x,y)=>x.a-y.a);
 let html="",i=0;
 for(const r of rep){html+=esc(chars.slice(i,r.a).join(""))+'<img class="emo" src="https://static-cdn.jtvnw.net/emoticons/v2/'+encodeURIComponent(r.id)+'/default/dark/2.0">';i=r.b+1}
 html+=esc(chars.slice(i).join(""));
 const color=/^#[0-9a-f]{6}$/i.test(tags.color||"")?tags.color:"#a855f7";
 const box=document.getElementById("msgs");if(!box)return;
 const d=document.createElement("div");d.className="msg";
 d.innerHTML='<b style="color:'+color+'">'+esc(tags["display-name"]||m[2])+'</b> '+html;
 box.appendChild(d);while(box.children.length>40)box.firstChild.remove();
}
Overlay.on("state",st=>{
 setChat(st);
 Overlay.renderItems(custom,st.items);
 Overlay.applyLayout(st.layout,{cam,live:lv,lower:lt,chat:ch,goal:go,bottom:bt});
 n.textContent=st.name;tp.textContent=st.topic;
 lt.classList.toggle("show",st.lowerThirdVisible);
 const h4=ch.querySelector("h4");if(h4)h4.textContent=st.chatTitle;
 cam.style.display=st.camVisible?"":"none";lv.style.display=st.liveVisible?"":"none";
 lvt.textContent=st.liveText;tg.textContent=st.tickerTag;
 ch.style.display=st.chatVisible?"":"none";
 go.style.display=st.goalVisible?"":"none";
 bt.style.display=st.tickerVisible?"":"none";
 gl.textContent=st.goal.label;gv.textContent=st.goal.current+" / "+st.goal.target;
 gb.style.width=Math.min(100,st.goal.current/st.goal.target*100)+"%";
 items=[...st.ticker,...st.socials.map(x=>x.label+": "+x.value)];
});
function nxt(){if(!items.length)return;tk.style.opacity=0;setTimeout(()=>{tk.textContent=items[i++%items.length];tk.style.opacity=1},500)}
setTimeout(nxt,600);setInterval(nxt,6000);
</script></body></html>

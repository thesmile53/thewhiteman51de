<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script src="config.js"></script><title>Starting</title></head>
<body class="solid"><div class="grid"></div>
<div class="center">
  <div class="brand grad" id="n"></div>
  <div class="sub pulse"><span id="t"></span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="big" id="c">--:--</div>
</div>
<div class="socials" id="s"></div>
<script>
const C=CONFIG;n.textContent=C.name;t.textContent=C.startingText;
s.innerHTML=C.socials.map(x=>"<div><b>"+x.label+"</b>"+x.value+"</div>").join("");
const q=new URLSearchParams(location.search);
const end=Date.now()+(+q.get("min")||C.startingMinutes)*60000;
setInterval(()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));
 c.textContent=String(r/60|0).padStart(2,"0")+":"+String(r%60).padStart(2,"0");},250);
</script></body></html>
